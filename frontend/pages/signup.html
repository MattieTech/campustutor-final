<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Create Free Account — CampusTutor AI</title>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<meta name="theme-color" content="#060d24"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="CampusTutor"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
</head>
<body class="auth-page">
<div class="auth-orb1"></div>
<div class="auth-orb2"></div>

<div class="auth-card auth-card-wide">
  <!-- Top Navigation & Controls -->
  <div class="auth-top-bar">
    <a href="/" class="auth-nav-pill" title="Return to home page">
      <i class="fa-solid fa-arrow-left"></i> <span>Home</span>
    </a>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">
      <i class="fa-solid fa-moon"></i>
    </button>
  </div>

  <!-- Brand & Welcome -->
  <div class="auth-brand">
    <div class="auth-brand-icon">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    <div class="auth-brand-title">
      <h1><span class="brand-campus">Campus</span><span class="brand-tutor">Tutor</span><span class="brand-ai">AI</span></h1>
      <span class="ct-exact-badge" style="background:#0070F3;color:#fff;font-size:0.68rem;font-weight:800;padding:2px 7px;border-radius:999px;">2.0</span>
    </div>
    <h2 class="auth-heading">Create your free account</h2>
    <p class="auth-sub">Join thousands of students studying smarter with CampusTutor AI.</p>
  </div>

  <!-- Session Switcher / Active User Banner (solves redirect confusion) -->
  <div id="alreadyLoggedInBanner" style="display:none;"></div>

  <!-- Alerts -->
  <div class="alert alert-error" id="errMsg"></div>
  <div class="alert alert-success" id="okMsg"></div>

  <!-- Sign Up Form -->
  <form id="signupForm">
    <div class="form-group">
      <label class="auth-form-label" for="fullName">
        <span class="label-icon"><i class="fa-regular fa-user"></i> Full Name</span>
      </label>
      <div class="auth-input-group">
        <i class="fa-regular fa-user auth-input-icon"></i>
        <input class="form-input" type="text" id="fullName" placeholder="e.g. Matthew Adeyemi" required autocomplete="name"/>
      </div>
    </div>

    <div class="form-group">
      <label class="auth-form-label" for="email">
        <span class="label-icon"><i class="fa-regular fa-envelope"></i> Email Address</span>
      </label>
      <div class="auth-input-group">
        <i class="fa-regular fa-envelope auth-input-icon"></i>
        <input class="form-input" type="email" id="email" placeholder="you@school.edu.ng" required autocomplete="email"/>
      </div>
    </div>

    <div class="form-group">
      <div class="auth-form-label">
        <span class="label-icon"><i class="fa-solid fa-lock"></i> Password</span>
        <span style="font-size:0.75rem;color:var(--label3);text-transform:none;font-weight:500;">Min. 6 chars</span>
      </div>
      <div class="password-input-wrapper auth-input-group">
        <i class="fa-solid fa-lock auth-input-icon"></i>
        <input class="form-input" type="password" id="password" placeholder="Create a secure password" required minlength="6" autocomplete="new-password"/>
        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle password visibility">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label class="auth-form-label" for="confirmPwd">
        <span class="label-icon"><i class="fa-solid fa-shield-halved"></i> Confirm Password</span>
      </label>
      <div class="password-input-wrapper auth-input-group">
        <i class="fa-solid fa-shield-halved auth-input-icon"></i>
        <input class="form-input" type="password" id="confirmPwd" placeholder="Repeat your password" required minlength="6" autocomplete="new-password"/>
        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirmPwd', this)" aria-label="Toggle password visibility">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>
    </div>

    <div class="form-group">
      <div class="auth-form-label">
        <span class="label-icon"><i class="fa-solid fa-ticket"></i> Referral Code</span>
        <span style="font-size:0.74rem;color:var(--label3);text-transform:none;font-weight:500;">Optional</span>
      </div>
      <div class="auth-input-group">
        <i class="fa-solid fa-ticket auth-input-icon"></i>
        <input class="form-input" type="text" id="referredByInput" placeholder="e.g. CT_REF_XXXXXX"/>
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-full btn-lg" id="signupBtn" style="margin-top:8px;">
      <span>Create Free Account</span> <i class="fa-solid fa-arrow-right"></i>
    </button>
  </form>

  <div class="auth-divider">or continue with</div>

  <!-- Continue with Google Button -->
  <div id="google-signin-btn"></div>

  <!-- Switch link -->
  <div class="auth-footer-prompt">
    Already have an account? <a href="/pages/login.html">Log in →</a>
  </div>

  <!-- Trust Badge -->
  <div class="auth-credit-badge">
    <i class="fa-solid fa-shield-halved"></i> 256-bit SSL encryption · Developed & Maintained by MattieTech
  </div>
</div>

<script src="/js/api.js"></script>
<script>
// Theme Management
const t = localStorage.getItem('ct_theme') || 'light';
document.documentElement.setAttribute('data-theme', t);
const themeBtn = document.getElementById('themeBtn');
themeBtn.innerHTML = t === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
themeBtn.addEventListener('click', () => {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nextTheme);
  localStorage.setItem('ct_theme', nextTheme);
  themeBtn.innerHTML = nextTheme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
  renderGoogleButton();
});

// Check Session with Graceful Banner (Prevents surprise redirects)
redirectIfLoggedIn();

// Capture referral parameter from URL if present
const urlParams = new URLSearchParams(window.location.search);
const referredBy = urlParams.get('ref');
if (referredBy) {
  document.getElementById('referredByInput').value = referredBy.trim().toUpperCase();
}

let registeredEmail = '';

// Form Submission
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('errMsg'), ok = document.getElementById('okMsg');
  err.style.display = 'none';
  ok.style.display = 'none';

  const pwd = document.getElementById('password').value;
  const confirmPwd = document.getElementById('confirmPwd').value;
  if (pwd !== confirmPwd) {
    err.textContent = 'Passwords do not match. Please verify.';
    err.style.display = 'block';
    return;
  }

  const btn = document.getElementById('signupBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;margin-right:6px;"></span> Creating account...';

  registeredEmail = document.getElementById('email').value.trim();
  const refCodeVal = document.getElementById('referredByInput').value.trim();

  const { data, error } = await apiSignup(
    document.getElementById('fullName').value.trim(),
    registeredEmail,
    pwd,
    refCodeVal || null
  );

  if (error) {
    err.textContent = error;
    err.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '<span>Create Free Account</span> <i class="fa-solid fa-arrow-right"></i>';
    return;
  }

  // Auto log in newly registered user
  const loginRes = await apiLogin(registeredEmail, pwd);
  if (loginRes.error) {
    ok.innerHTML = '<i class="fa-solid fa-circle-check"></i> Account created successfully! Redirecting to login...';
    ok.style.display = 'block';
    setTimeout(() => { window.location.href = '/pages/login.html'; }, 1500);
    return;
  }

  ok.innerHTML = '<i class="fa-solid fa-circle-check"></i> Account created! Redirecting to your dashboard...';
  ok.style.display = 'block';
  setTimeout(() => { window.location.href = '/pages/pricing.html?new_user=true'; }, 1000);
});

// Google Sign-In Setup
let googleClientId = "";

async function initGoogleSignIn() {
  try {
    const { data } = await apiRequest('/api/auth/config');
    googleClientId = (data && data.googleClientId) || "1028751505342-placeholder.apps.googleusercontent.com";
    
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({
        client_id: googleClientId,
        callback: handleCredentialResponse,
        auto_select: false,
        itp_support: true
      });
      renderGoogleButton();
    }
  } catch (err) {
    console.error("Error initializing Google Sign-In:", err);
  }
}

function renderGoogleButton() {
  const btnContainer = document.getElementById("google-signin-btn");
  if (btnContainer && window.google && google.accounts && google.accounts.id) {
    btnContainer.innerHTML = '';
    google.accounts.id.renderButton(
      btnContainer,
      { 
        theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'filled_black' : 'outline', 
        size: 'large',
        width: Math.min(btnContainer.offsetWidth || 340, 380),
        text: 'continue_with',
        shape: 'pill'
      }
    );
  }
}

async function handleCredentialResponse(response) {
  if (!response || !response.credential) {
    showToast('Google authentication failed.', 'error');
    return;
  }
  
  showToast('Connecting with Google...', 'info');
  const { data, error } = await apiRequest('/api/auth/google-login', 'POST', { credential: response.credential });
  if (error) {
    showToast(error, 'error');
    return;
  }
  
  localStorage.setItem("ct_token", data.token);
  localStorage.setItem("ct_user", JSON.stringify(data.user));
  showToast(`Welcome to CampusTutor, ${data.user.fullName}! <i class="fa-solid fa-circle-check"></i>`, 'success');
  
  const { data: stats } = await apiRequest(`/api/upload/stats/${data.user.id}`);
  const plan = (stats?.plan || 'free').toLowerCase();
  if (plan === 'free') {
    setTimeout(() => { window.location.href = '/pages/pricing.html?new_user=true'; }, 1000);
  } else {
    setTimeout(() => { window.location.href = '/pages/dashboard.html'; }, 1000);
  }
}

window.addEventListener('load', () => {
  initGoogleSignIn();
});
</script>
</body>
</html>
