<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Log In — CampusTutor AI</title>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<meta name="theme-color" content="#060d24"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="CampusTutor"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
</head>
<body class="auth-page">
<div class="auth-orb1"></div>
<div class="auth-orb2"></div>

<div class="auth-card">
  <!-- Top Navigation & Controls -->
  <div class="auth-top-bar">
    <a href="/" class="auth-nav-pill" title="Return to home page">
      <i class="fa-solid fa-arrow-left"></i> <span>Home</span>
    </a>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">
      <i class="fa-solid fa-moon"></i>
    </button>
  </div>

  <!-- Brand & Welcome -->
  <div class="auth-brand">
    <div class="auth-brand-icon">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    <div class="auth-brand-title">
      <h1><span class="brand-campus">Campus</span><span class="brand-tutor">Tutor</span><span class="brand-ai">AI</span></h1>
      <span class="ct-exact-badge" style="background:#0070F3;color:#fff;font-size:0.68rem;font-weight:800;padding:2px 7px;border-radius:999px;">2.0</span>
    </div>
    <h2 class="auth-heading">Welcome back</h2>
    <p class="auth-sub">Log in to continue your personalized learning journey.</p>
  </div>

  <!-- Session Switcher / Active User Banner (solves redirect confusion) -->
  <div id="alreadyLoggedInBanner" style="display:none;"></div>

  <!-- Alerts -->
  <div id="statusAlert" style="display:none;padding:12px;border-radius:14px;background:rgba(175,82,222,.12);border:1px solid rgba(175,82,222,.32);color:#af52de;margin-bottom:16px;text-align:center;font-size:0.88rem;font-weight:600;">
    <i class="fa-solid fa-lock"></i> Your session has expired. Please log in again!
  </div>
  <div class="alert alert-error" id="errMsg"></div>

  <!-- Login Form -->
  <form id="loginForm">
    <div class="form-group">
      <label class="auth-form-label" for="email">
        <span class="label-icon"><i class="fa-regular fa-envelope"></i> Email Address</span>
      </label>
      <div class="auth-input-group">
        <i class="fa-regular fa-envelope auth-input-icon"></i>
        <input class="form-input" type="email" id="email" placeholder="you@school.edu.ng" required autocomplete="email"/>
      </div>
    </div>

    <div class="form-group">
      <div class="auth-form-label">
        <span class="label-icon"><i class="fa-solid fa-lock"></i> Password</span>
        <a href="/pages/reset.html" style="font-size:0.78rem;color:var(--blue);text-transform:none;letter-spacing:normal;font-weight:600;">Forgot Password?</a>
      </div>
      <div class="password-input-wrapper auth-input-group">
        <i class="fa-solid fa-lock auth-input-icon"></i>
        <input class="form-input" type="password" id="password" placeholder="Enter your password" required autocomplete="current-password"/>
        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle password visibility">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn" style="margin-top:8px;">
      <span>Log In</span> <i class="fa-solid fa-arrow-right"></i>
    </button>
  </form>

  <div class="auth-divider">or continue with</div>

  <!-- Continue with Google Button -->
  <div id="google-signin-btn"></div>

  <!-- Switch link -->
  <div class="auth-footer-prompt">
    Don't have an account? <a href="/pages/signup.html">Sign up free →</a>
  </div>

  <!-- Trust Badge -->
  <div class="auth-credit-badge">
    <i class="fa-solid fa-shield-halved"></i> 256-bit SSL encryption · Developed & Maintained by MattieTech
  </div>
</div>

<script src="/js/api.js"></script>
<script>
// Theme Management
const t = localStorage.getItem('ct_theme') || 'light';
document.documentElement.setAttribute('data-theme', t);
const themeBtn = document.getElementById('themeBtn');
themeBtn.innerHTML = t === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
themeBtn.addEventListener('click', () => {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nextTheme);
  localStorage.setItem('ct_theme', nextTheme);
  themeBtn.innerHTML = nextTheme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
  renderGoogleButton();
});

// Check Session
redirectIfLoggedIn();

// Expired Session Alert
const params = new URLSearchParams(window.location.search);
if (params.get('status') === 'expired') {
  document.getElementById('statusAlert').style.display = 'block';
}

// Form Submission
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('errMsg');
  err.style.display = 'none';
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;margin-right:6px;"></span> Logging in...';

  const emailVal = document.getElementById('email').value.trim();
  const pwdVal = document.getElementById('password').value;

  const { data, error } = await apiLogin(emailVal, pwdVal);
  if (error || !data || !data.user) {
    err.textContent = error || 'Invalid email or password.';
    err.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '<span>Log In</span> <i class="fa-solid fa-arrow-right"></i>';
    return;
  }

  showToast(`Welcome back, ${data.user.fullName || 'Scholar'}! <i class="fa-solid fa-circle-check"></i>`, 'success');
  setTimeout(() => {
    window.location.href = '/pages/dashboard.html';
  }, 700);
});

// Google Sign-In Setup
let googleClientId = "";

async function initGoogleSignIn() {
  try {
    const { data } = await apiRequest('/api/auth/config');
    googleClientId = (data && data.googleClientId) || "1028751505342-placeholder.apps.googleusercontent.com";
    
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({
        client_id: googleClientId,
        callback: handleCredentialResponse,
        auto_select: false,
        itp_support: true
      });
      renderGoogleButton();
    }
  } catch (err) {
    console.error("Error initializing Google Sign-In:", err);
  }
}

function renderGoogleButton() {
  const btnContainer = document.getElementById("google-signin-btn");
  if (btnContainer && window.google && google.accounts && google.accounts.id) {
    btnContainer.innerHTML = '';
    google.accounts.id.renderButton(
      btnContainer,
      { 
        theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'filled_black' : 'outline', 
        size: 'large',
        width: Math.min(btnContainer.offsetWidth || 340, 380),
        text: 'continue_with',
        shape: 'pill'
      }
    );
  }
}

async function handleCredentialResponse(response) {
  if (!response || !response.credential) {
    showToast('Google authentication failed.', 'error');
    return;
  }
  
  showToast('Connecting with Google...', 'info');
  const { data, error } = await apiRequest('/api/auth/google-login', 'POST', { credential: response.credential });
  if (error) {
    showToast(error, 'error');
    return;
  }
  
  localStorage.setItem("ct_token", data.token);
  localStorage.setItem("ct_user", JSON.stringify(data.user));
  showToast(`Welcome back, ${data.user.fullName}! <i class="fa-solid fa-circle-check"></i>`, 'success');
  
  const role = data.user?.app_metadata?.role || data.user?.role;
  if (role === 'admin') {
    setTimeout(() => { window.location.href = '/pages/dashboard.html'; }, 800);
    return;
  }
  
  const { data: stats } = await apiRequest(`/api/upload/stats/${data.user.id}`);
  const plan = (stats?.plan || 'free').toLowerCase();
  const isExpired = stats?.subscription_end ? (new Date(stats.subscription_end).getTime() < Date.now()) : false;
  if (plan === 'free' || isExpired) {
    setTimeout(() => { window.location.href = '/pages/pricing.html?reason=paywall'; }, 800);
  } else {
    setTimeout(() => { window.location.href = '/pages/dashboard.html'; }, 800);
  }
}

window.addEventListener('load', () => {
  initGoogleSignIn();
});
</script>
</body>
</html>
